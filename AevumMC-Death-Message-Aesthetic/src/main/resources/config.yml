# ╔══════════════════════════════════════════════════════════════╗
# ║          A E V U M M C  •  D E A T H  M E S S A G E S       ║
# ║                       IMPERIUM EDITION                       ║
# ╚══════════════════════════════════════════════════════════════╝
#
# Design language: antique gold, ivory, muted stone and restrained crimson.
# Placeholders are safely inserted as plain text:
#   <victim> = the player who died
#   <killer> = the player, mob or named entity responsible
#
# MiniMessage colours: <#C98B24>, <#E0A63A>, <#F3EBDD>, <#8B8B95>, <#E05252>.
# Add more lines under a message key for more variation.
# After editing, run /aevumdeath reload.

settings:
  enabled: true
  # Also use the styled line on the dying player's death screen.
  style-death-screen: true
  # Pick a random template when a key has multiple variants.
  random-variants: true

messages:
  player-kill:
    - '<#C98B24>⚔ <#E0A63A><victim> <#8B8B95>was slain by <#F3EBDD><killer><#8B8B95>.'
    - '<#C98B24>⚔ <#E0A63A><victim><#8B8B95> fell to the blade of <#F3EBDD><killer><#8B8B95>.'
    - '<#C98B24>✦ <#F3EBDD><killer> <#8B8B95>claimed the life of <#E0A63A><victim><#8B8B95>.'

  player-projectile-kill:
    - '<#C98B24>➶ <#E0A63A><victim> <#8B8B95>was struck down by <#F3EBDD><killer><#8B8B95>.'
    - '<#C98B24>➶ <#F3B85B><killer><#8B8B95>''s aim proved fatal to <#E0A63A><victim><#8B8B95>.'

  mob-kill:
    - '<#C98B24>☠ <#E0A63A><victim> <#8B8B95>was claimed by <#F3EBDD><killer><#8B8B95>.'
    - '<#C98B24>☠ <#E0A63A><victim> <#8B8B95>fell to a <#F3EBDD><killer><#8B8B95>.'

  mob-projectile-kill:
    - '<#C98B24>➶ <#E0A63A><victim> <#8B8B95>was shot down by a <#F3EBDD><killer><#8B8B95>.'

  projectile:
    - '<#C98B24>➶ <#E0A63A><victim> <#8B8B95>was struck by an unseen projectile.'

  fall:
    - '<#C98B24>↡ <#E0A63A><victim> <#8B8B95>fell from the heights.'
    - '<#C98B24>↡ <#E0A63A><victim> <#8B8B95>learned that the ground always wins.'

  lava:
    - '<#C98B24>◆ <#E05252><victim> <#8B8B95>was consumed by molten fire.'
    - '<#C98B24>◆ <#E05252><victim> <#8B8B95>was claimed by the lava.'

  fire:
    - '<#C98B24>♨ <#E05252><victim> <#8B8B95>was lost to the flames.'
