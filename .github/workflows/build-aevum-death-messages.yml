name: Build AevumMC Death Message Aesthetic

on:
  push:
    paths:
      - 'AevumMC-Death-Message-Aesthetic/**'
      - '.github/workflows/build-aevum-death-messages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AevumMC-Death-Message-Aesthetic
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build plugin
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: AevumMC-Death-Message-Aesthetic
          path: AevumMC-Death-Message-Aesthetic/target/AevumMC-Death-Message-Aesthetic.jar
          if-no-files-found: error
